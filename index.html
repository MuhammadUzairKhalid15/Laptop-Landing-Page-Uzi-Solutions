<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Landing Page | Uzi Solutions</title>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="Logo">
            <h4 id="logo">Uzi Store</h4>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a class="nav-link" href="#">Specs</a></li>
                <li><a class="nav-link" href="#">Products</a></li>
                <li><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="cart">
            <img src="images/shopping-cart.png" alt="">
        </div>
    </header>

    <main>
        <section class="presentation">
            <div class="introduction">
                <div class="intro-text">
                    <h1>Laptop for the future</h1>
                    <p>The new 14 inch bezel less display offering a 4k display with touch screen</p>
                </div>
                <div class="cta">
                    <button class="cta-select">14 Inch</button>
                    <button class="cta-add">Add To Cart</button>
                </div>
            </div>
            <div class="cover">
                <img src="images/matebook-cover.png" alt="">
            </div>
        </section>

        <div class="laptop-select">
            <img src="images/arrow-left.png" alt="">
            <img src="images/full_dot.png" alt="">
            <img src="images/dot.png" alt="">
            <img src="images/full_dot.png" alt="">
            <img src="images/arrow-right.png" alt="">
        </div>

        <img class="big-circle" src="images/big-eclipse.svg" alt="">
        <img class="medium-circle" src="images/medium-eclipse.svg" alt="">
    </main>
</body>
</html>
